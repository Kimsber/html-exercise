<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        form {
            position: relative;
            background-color: rgb(240, 240, 255);
            width: 50%;
            margin: 2.5% auto;
            padding: 2.5%;
            border-radius: 7px;
            box-shadow: 10px 8px 8px rgb(40, 40, 40);
        }

        input {
            margin: 1% 2%;
            font-size: 24px;
            text-align: center;
        }

        label {
            margin: 1% 0%;
            font-size: 24px;
        }

        .demo {
            margin: 1% auto;
            padding: 0 3%;
            font-size: 24px;
        }

        option {
            font-size: 24px;
        }

        button:hover {
            background-color: rgb(67, 67, 150);
            -webkit-text-fill-color: aliceblue;
        }

        #result {
            text-align: center;
            background-color: rgb(187, 210, 255);
            width: 88%;
            height: 30%;
            margin: 30px auto;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid rgba(0, 0, 0, 0.47);
        }

        .bmi {
            font-size: 2rem;
            font-weight: 135;
        }

        .comment {
            font-size: 1.2rem;
            font-weight: 110;
        }

        #info {
            text-align: center;
            background-color: rgb(187, 210, 255);
            width: 88%;
            height: 20%;
            margin: 30px auto;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid rgba(0, 0, 0, 0.47);
            font-size: 1.5rem;
            font-weight: 105;
        }

        #home {
            position: absolute;
            font-size: 24px;
            text-decoration: none;
            color: rgb(0, 0, 0);
            background-color: rgb(171, 200, 254);
            padding: 5px;
            border-radius: 5px;
            right: 12px;
            top: 12px;
        }

        #stat {
            text-align: center;
            background-color: rgb(187, 210, 255);
            width: 66%;
            height: 20%;
            margin: 30px auto;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid rgba(0, 0, 0, 0.47);
        }

        #datalist {
            text-align: center;
            background-color: rgb(187, 210, 255);
            margin: 30px auto;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid rgba(0, 0, 0, 0.47);
        }
    </style>
    <script src="js/bmi.js"></script>
</head>

<body>
    <h1>BMI計算機</h1>

    <div id="stat">

    </div>

    <button type="button" style="background-color: crimson;" id="deleteStat" style="font-size: 24px;">刪除</button>

    <form action="">
        <label for="username">姓名:</label>
        <input type="text" name="name" id="username" placeholder="請輸入姓名">
        <br>
        <label for="age">年齡:</label>
        <input type="number" name="age" id="age">
        <br>
        <label for="height">身高:</label>
        <input type="number" name="height" id="height" step="0.5">
        <br>
        <label for="weight">體重:</label>
        <input type="number" name="weight" id="weight" step="0.5">

        <div class="demo">
            <input type="radio" name="sex" id="male" checked value="男性"> 男
            <input type="radio" name="sex" id="female" value="女性"> 女

            <label for="country">居住縣市</label>
            <select name="country" id="country" style="font-size: 24px;">
                <option value="台北">台北市</option>
                <option value="新北">新北市</option>
            </select>

        </div>

        <button type="button" onclick="calc()" style="font-size: 24px;">計算</button>

        <a id="home" href="index.html">回首頁</a>

    </form>

    <div id="info" hidden>

    </div>

    <div id="result" hidden>
        BMI:<span class="bmi">

        </span>
        <p class="comment">

        </p>
    </div>

    <div id="datalist">
        <table border=1px>
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>年齡</th>
                    <th>性別</th>
                    <th>居住地</th>
                    <th>身高</th>
                    <th>體重</th>
                    <th>BMI</th>
                </tr>
            </thead>
    </div>

</body>

<script>
    const nameEl = document.querySelector("#username");
    const ageEl = document.querySelector("#age");
    const heightEl = document.querySelector("#height");
    const weightEl = document.querySelector("#weight");
    const countryEl = document.querySelector("#country");
    const deleteStatEl = document.querySelector("#deleteStat");
    //const sexEl = document.querySelector("input[name='sex']:checked");

    deleteStatEl.addEventListener("click", function () {
        localStorage.removeItem("stat");
        //刷新頁面 
        //window.location.href = "";
        //清除站站存值
        data.total = 0;
        data.count = 0;
        //清除區塊資料
        document.querySelector("#stat").innerHTML = "";
        document.querySelector("#datalist").innerHTML = "";
    });

    //物件宣告:似字典
    let data = {
        total: 0,
        count: 0
    }

    //讀取datas
    let datas = JSON.parse(localStorage.getItem("datas")) || [];

    //將單筆資料轉成物件
    stat = JSON.parse(localStorage.getItem("stat"));

    if (stat) {
        data = stat;
        //加入紀錄顯示
        let avg = (data.total / data.count).toFixed(2);
        document.querySelector("#stat").innerHTML = `<h3>紀錄人數:${data.count} 平均BMI:${(data.total / data.count).toFixed(2)}</h3>`;
    }

    if (datas.length > 0) {
        renderTable(datas);
    }
    //console.log(nameEl, ageEl, heightEl.value, weightEl.value, countryEl.value, sexEl.value);

    //函式宣告

    function addRow(data) {
        teturn`
        <tr>
            <td>${data.name}</td>
            <td>${data.age}</td>
            <td>${data.sex}</td>
            <td>${data.country}</td>
            <td>${data.height}</td>
            <td>${data.weight}</td>
            <td>${data.bmi}</td>
        </tr>
        `;
    }

    function renderTable(datas) {
        tdata = "";
        for (let i = 0; i < datas.length; i++) {
            let tdata = addRow(datas[i]);
            console.log(datas[i]);
            tdata += addRow(datas[i]);
        }

        let tablehtml = `
            <table border=1px>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>年齡</th>
                        <th>性別</th>
                        <th>居住地</th>
                        <th>身高</th>
                        <th>體重</th>
                        <th>BMI</th>
                    </tr>
                </thead>
                <tbody>
                ${tdata}
                </tbody>
            </table>
        `;
    }

    function calc() {
        const sexEl = document.querySelector("input[name='sex']:checked");
        let name = nameEl.value;
        let age = ageEl.value;
        let sex = sexEl.value;
        let country = countryEl.value;
        let weight = weightEl.value;
        let height = heightEl.value;


        if (weight <= 0 || height <= 0) {
            alert("數值無效:>0");
            return;
        }

        if (isNaN(weight) || isNaN(height)) {
            alert("請輸入數值:not numeric");
            return;
        }

        let userinfo = `姓名:${name} 年齡:${age} 性別:${sex} 居住地:${country}`;
        console.log(userinfo);
        document.querySelector("#info").innerHTML = `<h3>${userinfo}</h3>`;

        document.querySelector("#result").Hidden = false;

        let bmi = getBmi(height, weight);
        let result = getComment(bmi);

        console.log(bmi, result[0], result[1]);

        //document.querySelector("#result").innerHTML = `<h3>BMI:${getComment(bmi)}<br>${comment}</h3>`;

        const bmiEl = document.querySelector(".bmi");
        bmiEl.innerText = bmi;
        bmiEl.style.color = result[1];
        document.querySelector(".comment").innerText = result[0];

        document.querySelector("#info").hidden = false;
        document.querySelector("#result").hidden = false;

        //紀錄BMI資料
        data.total += Number(bmi);
        data.count += 1;

        let avg = (data.total / data.count).toFixed(2);
        console.log(data, avg);
        document.querySelector("#stat").innerHTML = `<h3>紀錄人數:${data.count} 平均BMI:${avg}</h3>`;

        //儲存資料至本地網頁(字串化)
        localStorage.setItem("stat", JSON.stringify(data));

        //儲存單筆資料
        let person = {
            name: nameEl.value,
            age: ageEl.value,
            sex: sexEl.value,
            height: height,
            weight: weight,
            bmi: bmi
        }

        //console.log(person);
        datas.push(person);

        //儲存datas
        localStorage.setItem("datas", JSON.stringify(datas));

        renderTable(datas);
    }

</script>

</html>
